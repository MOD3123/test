name: Build IPA (unsigned, for TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          xcodebuild -project WebCenter.xcodeproj -scheme WebCenter \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          rm -rf Payload WebCenter.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WebCenter.app Payload/
          zip -qry WebCenter.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WebCenter-ipa
          path: WebCenter.ipa
