<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domovská stránka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #0a0e1a;
          --surface: rgba(255,255,255,0.04);
          --surface-hover: rgba(255,255,255,0.08);
          --border: rgba(255,255,255,0.08);
          --text: #e8eaf0;
          --muted: #8890a4;
          --accent: #4f8ef7;
          --accent2: #7c5cbf;
          --gold: #d4a853;
          --danger: #e05555;
          --green: #4dba87;
          --clock-color: #fff;
        }

        @media (prefers-color-scheme: light) {
          :root {
            --bg: #dde2ef;
            --surface: rgba(255,255,255,0.80);
            --surface-hover: rgba(255,255,255,0.98);
            --border: rgba(0,0,0,0.13);
            --text: #0d1117;
            --muted: #3a4260;
            --accent: #1a5fd4;
            --accent2: #5030a0;
            --gold: #8a5e00;
            --danger: #aa1f1f;
            --green: #1a7050;
            --clock-color: #0d1117;
          }
          body { background: #dde2ef; }
          body::before {
            background:
              radial-gradient(ellipse 80% 60% at 15% 10%, rgba(79,142,247,0.15) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 85% 80%, rgba(124,92,191,0.10) 0%, transparent 55%);
          }
          body::after { opacity: 0.06; }
          .clock-time { text-shadow: 0 2px 20px rgba(26,95,212,0.10); }
          .link-card {
            background: rgba(255,255,255,0.82) !important;
            border-color: rgba(0,0,0,0.11) !important;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
          }
          .link-card:hover {
            background: #fff !important;
            border-color: rgba(0,0,0,0.20) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.13) !important;
          }
          .link-label { color: #0d1117 !important; font-weight: 600 !important; }
          .link-icon { background: rgba(0,0,0,0.06) !important; }
          .section-label { color: #3a4260; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        a, button {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }

        body {
          min-height: 100vh;
          background: var(--bg);
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          overflow-x: hidden;
          position: relative;
        }

        /* Atmospheric background */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 60% at 15% 10%, rgba(79,142,247,0.12) 0%, transparent 60%),
            radial-gradient(ellipse 60% 50% at 85% 80%, rgba(124,92,191,0.1) 0%, transparent 55%),
            radial-gradient(ellipse 40% 40% at 50% 50%, rgba(212,168,83,0.04) 0%, transparent 60%);
          pointer-events: none;
          z-index: 0;
        }

        /* Noise texture overlay */
        body::after {
          content: '';
          position: fixed;
          inset: 0;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
          pointer-events: none;
          z-index: 0;
          opacity: 0.4;
        }

        .wrapper {
          position: relative;
          z-index: 1;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0;
          padding: 24px 20px 20px;
          width: 100%;
          max-width: 680px;
          margin: 0 auto;
          box-sizing: border-box;
        }

        /* === CLOCK === */
        .clock-section {
          width: 100%;
          text-align: center;
          padding: 10px 0 18px;
          animation: fadeUp 0.6s ease both;
        }

        .clock-time {
          font-family: 'DM Serif Display', serif;
          font-size: clamp(52px, 15vw, 88px);
          font-weight: 400;
          letter-spacing: -2px;
          line-height: 1;
          color: var(--clock-color, #fff);
          text-shadow: 0 0 60px rgba(79,142,247,0.3);
        }

        .clock-date {
          font-size: 13px;
          color: var(--muted);
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-top: 6px;
          font-weight: 500;
        }

        /* === QUICK LINKS === */
        .links-section {
          width: 100%;
          margin-bottom: 20px;
          animation: fadeUp 0.6s 0.1s ease both;
        }

        .section-label {
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--muted);
          margin-bottom: 10px;
          padding-left: 2px;
        }

        .links-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 8px;
        }

        .link-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 14px 8px 12px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 14px;
          text-decoration: none;
          color: var(--text);
          transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
          cursor: pointer;
          position: relative;
          overflow: hidden;
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
        }

        .link-card::before {
          content: '';
          position: absolute;
          inset: 0;
          opacity: 0;
          transition: opacity 0.25s ease;
          border-radius: inherit;
        }

        .link-card:hover {
          border-color: rgba(255,255,255,0.18);
          background: var(--surface-hover);
          box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        .link-card:hover::before { opacity: 1; }

        /* Individual card accents */
        .link-card.spravy { --card-color: #e05555; }
        .link-card.spravy::before { background: radial-gradient(ellipse at 50% 100%, rgba(224,85,85,0.15), transparent 70%); }
        .link-card.spravy .link-icon { color: #e05555; }

        .link-card.doprava { --card-color: #4f8ef7; }
        .link-card.doprava::before { background: radial-gradient(ellipse at 50% 100%, rgba(79,142,247,0.15), transparent 70%); }
        .link-card.doprava .link-icon { color: #4f8ef7; }

        .link-card.pravo { --card-color: var(--gold); }
        .link-card.pravo::before { background: radial-gradient(ellipse at 50% 100%, rgba(212,168,83,0.15), transparent 70%); }
        .link-card.pravo .link-icon { color: var(--gold); }

        .link-card.letaky { --card-color: var(--green); }
        .link-card.letaky::before { background: radial-gradient(ellipse at 50% 100%, rgba(77,186,135,0.15), transparent 70%); }
        .link-card.letaky .link-icon { color: var(--green); }

        .link-card.pocasie-link { --card-color: #7ec8e3; }
        .link-card.pocasie-link::before { background: radial-gradient(ellipse at 50% 100%, rgba(126,200,227,0.15), transparent 70%); }
        .link-card.pocasie-link .link-icon { color: #7ec8e3; }

        .link-card.nastroje { --card-color: #a78bfa; }
        .link-card.nastroje::before { background: radial-gradient(ellipse at 50% 100%, rgba(167,139,250,0.15), transparent 70%); }
        .link-card.nastroje .link-icon { color: #a78bfa; }

        .link-card.psc { --card-color: #f97316; }
        .link-card.psc::before { background: radial-gradient(ellipse at 50% 100%, rgba(249,115,22,0.15), transparent 70%); }
        .link-card.psc .link-icon { color: #f97316; }

        .link-card.zastavky { --card-color: #34d399; }
        .link-card.zastavky::before { background: radial-gradient(ellipse at 50% 100%, rgba(52,211,153,0.15), transparent 70%); }
        .link-card.zastavky .link-icon { color: #34d399; }

        .link-card.konvertor { --card-color: #fb923c; }
        .link-card.konvertor::before { background: radial-gradient(ellipse at 50% 100%, rgba(251,146,60,0.15), transparent 70%); }
        .link-card.konvertor .link-icon { color: #fb923c; }

        .link-card.slovnik2 { --card-color: #60a5fa; }
        .link-card.slovnik2::before { background: radial-gradient(ellipse at 50% 100%, rgba(96,165,250,0.15), transparent 70%); }
        .link-card.slovnik2 .link-icon { color: #60a5fa; }

        .link-card.solitaire { --card-color: #f472b6; }
        .link-card.solitaire::before { background: radial-gradient(ellipse at 50% 100%, rgba(244,114,182,0.15), transparent 70%); }
        .link-card.solitaire .link-icon { color: #f472b6; }

        .link-card.solitaire { --card-color: #f87171; }
        .link-card.solitaire::before { background: radial-gradient(ellipse at 50% 100%, rgba(248,113,113,0.15), transparent 70%); }
        .link-card.solitaire .link-icon { color: #f87171; }

        .link-icon {
          font-size: 22px;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: rgba(255,255,255,0.06);
        }

        .link-icon svg { width: 20px; height: 20px; }

        .link-label {
          font-size: 11px;
          font-weight: 500;
          text-align: center;
          color: var(--muted);
          line-height: 1.2;
          transition: color 0.2s;
        }

        .link-card:hover .link-label { color: var(--text); }

        /* === DIVIDER === */
        .divider {
          height: 1px;
          background: var(--border);
          margin: 4px 0 12px;
        }

        /* === Animations === */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(16px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Mobile */
        @media (max-width: 480px) {
          .links-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
          .link-card { padding: 12px 4px 10px; }
          .link-label { font-size: 10px; }
          .link-icon { width: 30px; height: 30px; font-size: 18px; }
        }
    </style>
</head>

<script>
    /* ========== CLOCK ========== */
    const DAYS = ['Nedeľa','Pondelok','Utorok','Streda','Štvrtok','Piatok','Sobota'];
    const MONTHS = ['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clockTime').textContent = h+':'+m+':'+s;
      const d = DAYS[now.getDay()];
      const date = d + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
      document.getElementById('clockDate').textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* ========== CLEAR BUTTON (kalkulačka) ========== */
    document.querySelectorAll('.search-box input').forEach(function(inp) {
      var clearBtn = inp.closest('.search-box').querySelector('.search-clear');
      if (!clearBtn) return;
      inp.addEventListener('input', function() {
        clearBtn.style.display = inp.value ? 'block' : 'none';
      });
      clearBtn.addEventListener('click', function() {
        inp.value = '';
        clearBtn.style.display = 'none';
        inp.focus();
      });
    });

</script>
